# Reference vhost for the self-hosted Supabase droplet.
# bootstrap.sh writes its own copy with the real hostname substituted in;
# this file is here so the config is reviewable in git.
#
# NOTE: this lives on the SUPABASE droplet, not on 168.144.188.190.
# certbot --nginx adds the listen 443 / ssl_certificate lines and the redirect.

upstream supabase_gw { server 127.0.0.1:8000; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name supabase.CHANGE-ME.sslip.io;

    client_max_body_size 50m;
    server_tokens off;

    # Studio is the full database admin UI. Basic auth in front of it as well as
    # its own login, because it is reachable from the public internet.
    location /studio/ {
        auth_basic "FlowDesk Supabase";
        auth_basic_user_file /etc/nginx/.supabase_htpasswd;
        proxy_pass http://supabase_gw;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is the API the FlowDesk browser bundle calls directly:
    # /auth/v1, /rest/v1, /realtime/v1, /storage/v1.
    location / {
        proxy_pass http://supabase_gw;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
