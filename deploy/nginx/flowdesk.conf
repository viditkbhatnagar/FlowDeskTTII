# FlowDesk — nginx vhost.
#
# Installed on the droplet as /etc/nginx/sites-available/flowdesk.conf and symlinked
# into sites-enabled/. This is FlowDesk's OWN file.
#
# SAFETY — read before touching anything on this box:
#   * NEVER edit the CRM's vhosts (admin.upcarrera.com, admissions.upcarrera.com).
#   * ALWAYS run `nginx -t` before `systemctl reload nginx`. A bad config anywhere
#     takes the whole server down, and the live upCarrera CRM is on it.
#
# IMPORTANT — FlowDesk is NOT a static SPA.
# It is TanStack Start with server-side rendering, so a Node process renders every
# page. There is no `root` of static files and no try_files fallback: every request
# is proxied. Do not copy the CRM's nginx config here.
#
# certbot --nginx will add the listen 443 / ssl_certificate lines and the port-80
# redirect to this file. Let it; do not hand-write them.

upstream flowdesk_app {
    server 127.0.0.1:3100;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;

    # Both hostnames. flowdesk.upcarrera.com is the real one (Site5 added the A
    # record on 22 September 2026); the sslip.io name stays as a fallback so any
    # link already shared keeps working.
    #
    # One certificate covers both, via:
    #   certbot --nginx --cert-name flowdesk.168-144-188-190.sslip.io \
    #     -d flowdesk.168-144-188-190.sslip.io -d flowdesk.upcarrera.com --expand
    # Expanding FlowDesk's own lineage, never the CRM's.
    server_name flowdesk.168-144-188-190.sslip.io flowdesk.upcarrera.com;

    client_max_body_size 25m;

    # Do not advertise the nginx version.
    server_tokens off;

    # Security headers. FlowDesk talks to Supabase directly from the browser, so a
    # strict Content-Security-Policy needs connect-src for the project URL; it is
    # deferred until the company-owned Supabase project exists (D2 condition 1).
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # Hashed build assets are immutable — cache them hard. This prefix block must come
    # before `location /` so it wins the match.
    location /assets/ {
        proxy_pass http://flowdesk_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SSR — everything else goes to the Node process, pages included.
    location / {
        proxy_pass http://flowdesk_app;
        proxy_http_version 1.1;

        # Upgrade headers so HMR/websocket traffic is not broken if it is ever needed.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_cache_bypass $http_upgrade;
    }
}
